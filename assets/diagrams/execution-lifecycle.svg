<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="t d"><title id="t">Execution lifecycle</title><desc id="d">A signal passes risk authorization, becomes an order, settles at its own instant, becomes a position, exits, and reaches accounting. Rejected, unresolved and undeterminable outcomes are explicit states, and every transition is recorded.</desc><style>
svg { --surface:#ffffff; --border:#d5dbe3; --ink:#1b2430; --ink2:#465263; --ink3:#5f6b7b; --grid:#e4e8ee;
       --s1:#2B65AD; --s2:#B86E1C; --neutral:#8792A2; --panel:#f4f6f9; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#0d1117; --border:#2d3643; --ink:#e6ebf2; --ink2:#b7c1ce; --ink3:#97a3b3; --grid:#232c37;
         --s1:#4C84CE; --s2:#C4802A; --neutral:#667182; --panel:#151b23; }
}
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.title { font-size:21px; font-weight:600; }
.sub { font-size:13.5px; fill:var(--ink2); }
.h { font-size:14px; font-weight:600; }
.l { font-size:13.5px; fill:var(--ink); }
.m { font-size:12.5px; fill:var(--ink3); }
.v { font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.n { font-size:12.5px; fill:var(--ink2); }
.t { font-size:11.5px; fill:var(--ink3); font-variant-numeric:tabular-nums; }
.m, .v, .t { paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
.bx { font-size:13.5px; font-weight:600; }
.bs { font-size:12px; fill:var(--ink2); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="411" rx="12" fill="var(--surface)" stroke="var(--border)"/><text x="32.0" y="44.0" class="title" text-anchor="start">Execution lifecycle</text><text x="32.0" y="67.0" class="sub" text-anchor="start">Conceptual view of one trade. Solid boxes are the normal path; dashed boxes are explicit non-fill outcomes</text><rect x="32" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="88.0" y="144.0" class="bx" text-anchor="middle">Signal</text><text x="88.0" y="162.0" class="bs" text-anchor="middle">closed candle only</text><line x1="144" y1="147" x2="162.66666666666666" y2="147" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="162.66666666666666" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="218.7" y="136.0" class="bx" text-anchor="middle">Risk</text><text x="218.7" y="154.0" class="bs" text-anchor="middle">authorization:</text><text x="218.7" y="170.0" class="bs" text-anchor="middle">limits, capital</text><line x1="274.66666666666663" y1="147" x2="293.3333333333333" y2="147" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="293.3333333333333" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="349.3" y="136.0" class="bx" text-anchor="middle">Order</text><text x="349.3" y="154.0" class="bs" text-anchor="middle">submitted,</text><text x="349.3" y="170.0" class="bs" text-anchor="middle">capital reserved</text><line x1="405.3333333333333" y1="147" x2="424.0" y2="147" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="424.0" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="480.0" y="144.0" class="bx" text-anchor="middle">Settlement</text><text x="480.0" y="162.0" class="bs" text-anchor="middle">at its own instant</text><line x1="536.0" y1="147" x2="554.6666666666666" y2="147" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="554.6666666666666" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="610.7" y="144.0" class="bx" text-anchor="middle">Position</text><text x="610.7" y="162.0" class="bs" text-anchor="middle">slot held</text><line x1="666.6666666666666" y1="147" x2="685.3333333333333" y2="147" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="685.3333333333333" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="741.3" y="136.0" class="bx" text-anchor="middle">Exit</text><text x="741.3" y="154.0" class="bs" text-anchor="middle">decision, order,</text><text x="741.3" y="170.0" class="bs" text-anchor="middle">fill</text><line x1="797.3333333333333" y1="147" x2="815.9999999999999" y2="147" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="815.9999999999999" y="104" width="112" height="86" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="872.0" y="136.0" class="bx" text-anchor="middle">Accounting</text><text x="872.0" y="154.0" class="bs" text-anchor="middle">fees, funding,</text><text x="872.0" y="170.0" class="bs" text-anchor="middle">margin</text><line x1="218.66666666666666" y1="190" x2="218.66666666666666" y2="232" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="114.66666666666666" y="232" width="208" height="66" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-dasharray="5 4"/><text x="218.7" y="262.0" class="bx" text-anchor="middle">Rejected before order</text><text x="218.7" y="280.0" class="bs" text-anchor="middle">no order, no reservation</text><line x1="480.0" y1="190" x2="480.0" y2="232" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="376.0" y="232" width="208" height="66" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-dasharray="5 4"/><text x="480.0" y="254.0" class="bx" text-anchor="middle">Unresolved</text><text x="480.0" y="272.0" class="bs" text-anchor="middle">evidence exhausted</text><text x="480.0" y="288.0" class="bs" text-anchor="middle">reservation released, no fill booked</text><line x1="741.3333333333333" y1="190" x2="741.3333333333333" y2="232" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="637.3333333333333" y="232" width="208" height="66" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-dasharray="5 4"/><text x="741.3" y="254.0" class="bx" text-anchor="middle">Exit not yet determinable</text><text x="741.3" y="272.0" class="bs" text-anchor="middle">same order stays active</text><text x="741.3" y="288.0" class="bs" text-anchor="middle">position and slot kept</text><rect x="32" y="330" width="896" height="58" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="480.0" y="356.0" class="bx" text-anchor="middle">Evidence record</text><text x="480.0" y="374.0" class="bs" text-anchor="middle">every transition is recorded with its timestamp, identity and reason</text></svg>
