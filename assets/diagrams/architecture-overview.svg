<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 626" width="960" height="626" role="img" aria-labelledby="t d"><title id="t">Execution Parity: architecture overview</title><desc id="d">A strategy feeds two execution paths, Historical Replay and the Freqtrade Dry-run runtime path. Both apply shared execution rules, produce evidence records, and meet in reconciliation.</desc><style>
svg { --surface:#ffffff; --border:#d5dbe3; --ink:#1b2430; --ink2:#465263; --ink3:#5f6b7b; --grid:#e4e8ee;
       --s1:#2B65AD; --s2:#B86E1C; --neutral:#8792A2; --panel:#f4f6f9; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#0d1117; --border:#2d3643; --ink:#e6ebf2; --ink2:#b7c1ce; --ink3:#97a3b3; --grid:#232c37;
         --s1:#4C84CE; --s2:#C4802A; --neutral:#667182; --panel:#151b23; }
}
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.title { font-size:21px; font-weight:600; }
.sub { font-size:13.5px; fill:var(--ink2); }
.h { font-size:14px; font-weight:600; }
.l { font-size:13.5px; fill:var(--ink); }
.m { font-size:12.5px; fill:var(--ink3); }
.v { font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.n { font-size:12.5px; fill:var(--ink2); }
.t { font-size:11.5px; fill:var(--ink3); font-variant-numeric:tabular-nums; }
.m, .v, .t { paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
.bx { font-size:13.5px; font-weight:600; }
.bs { font-size:12px; fill:var(--ink2); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="625" rx="12" fill="var(--surface)" stroke="var(--border)"/><text x="32.0" y="44.0" class="title" text-anchor="start">Execution Parity: architecture overview</text><text x="32.0" y="67.0" class="sub" text-anchor="start">Conceptual view. One set of execution rules, two paths, one comparison</text><rect x="330" y="92" width="300" height="56" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="480.0" y="117.0" class="bx" text-anchor="middle">Strategy</text><text x="480.0" y="135.0" class="bs" text-anchor="middle">signals and exit decisions</text><line x1="420" y1="148" x2="230" y2="200" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="540" y1="148" x2="730" y2="200" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="200" width="400" height="84" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="232.0" y="231.0" class="bx" text-anchor="middle">Historical path</text><text x="232.0" y="249.0" class="bs" text-anchor="middle">Historical Replay over public market data</text><text x="232.0" y="265.0" class="bs" text-anchor="middle">causal event order, deferred settlement</text><rect x="528" y="200" width="400" height="84" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="728.0" y="231.0" class="bx" text-anchor="middle">Runtime path</text><text x="728.0" y="249.0" class="bs" text-anchor="middle">Freqtrade Dry-run with the runtime integration</text><text x="728.0" y="265.0" class="bs" text-anchor="middle">Freqtrade keeps its own loop and orders</text><line x1="232" y1="284" x2="232" y2="322" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="728" y1="284" x2="728" y2="322" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="322" width="896" height="64" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="480.0" y="351.0" class="bx" text-anchor="middle">Shared execution rules</text><text x="480.0" y="369.0" class="bs" text-anchor="middle">execution intent · risk authorization · position and slot limits · order state tracking</text><line x1="232" y1="386" x2="232" y2="424" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="728" y1="386" x2="728" y2="424" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="424" width="400" height="64" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="232.0" y="453.0" class="bx" text-anchor="middle">Replay evidence</text><text x="232.0" y="471.0" class="bs" text-anchor="middle">orders, fills, positions, accounting, ledger</text><rect x="528" y="424" width="400" height="64" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="728.0" y="453.0" class="bx" text-anchor="middle">Dry-run evidence</text><text x="728.0" y="471.0" class="bs" text-anchor="middle">authorizations, orders, fills, trade database</text><line x1="232" y1="488" x2="400" y2="526" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="728" y1="488" x2="560" y2="526" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="250" y="526" width="460" height="76" rx="8" fill="var(--panel)" stroke="var(--s1)"/><text x="480.0" y="553.0" class="bx" text-anchor="middle">Reconciliation</text><text x="480.0" y="571.0" class="bs" text-anchor="middle">entries, exits, prices, timing, positions</text><text x="480.0" y="587.0" class="bs" text-anchor="middle">each divergence attributed or labelled unknown</text></svg>
