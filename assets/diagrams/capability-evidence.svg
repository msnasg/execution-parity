<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" width="960" height="546" role="img" aria-labelledby="t d"><title id="t">Capabilities and evidence, version 0.6.1</title><desc id="d">Four capability areas with the evidence status of each item, and a separate strip of proposed future work that is not implemented.</desc><style>
