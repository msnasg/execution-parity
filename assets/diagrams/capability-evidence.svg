rminal</text><text x="66.0" y="270.0" class="bs" text-anchor="start">states</text><circle cx="52" cy="292" r="5.5" fill="var(--s1)"/><text x="66.0" y="296.0" class="bs" text-anchor="start">Pending-order reservation</text><circle cx="52" cy="318" r="5.5" fill="var(--s1)"/><text x="66.0" y="322.0" class="bs" text-anchor="start">Checkpoint and restart</text><circle cx="52" cy="344" r="5" fill="none" stroke="var(--s1)" stroke-width="1.5"/><path d="M52 339 A5 5 0 0 0 52 349 Z" fill="var(--s1)"/><text x="66.0" y="348.0" class="bs" text-anchor="start">Market fills from public</text><text x="66.0" y="364.0" class="bs" text-anchor="start">trades</text><circle cx="52" cy="386" r="5" fill="none" stroke="var(--s1)" stroke-width="1.5"/><path d="M52 381 A5 5 0 0 0 52 391 Z" fill="var(--s1)"/><text x="66.0" y="390.0" class="bs" text-anchor="start">Limit orders, DCA, partial</text><text x="66.0" y="406.0" class="bs" text-anchor="start">exits</text><rect x="258" y="116" width="214" height="304" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="272.0" y="142.0" class="h" text-anchor="start">Runtime integration</text><circle cx="278" cy="166" r="5.5" fill="var(--s1)"/><text x="292.0" y="170.0" class="bs" text-anchor="start">Entry authorization via</text><text x="292.0" y="186.0" class="bs" text-anchor="start">callbacks</text><circle cx="278" cy="208" r="5.5" fill="var(--s1)"/><text x="292.0" y="212.0" class="bs" text-anchor="start">Position and gross-exposure</text><text x="292.0" y="228.0" class="bs" text-anchor="start">limits</text><circle cx="278" cy="250" r="5.5" fill="var(--s1)"/><text x="292.0" y="254.0" class="bs" text-anchor="start">Leverage clamp</text><circle cx="278" cy="276" r="5.5" fill="var(--s1)"/><text x="292.0" y="280.0" class="bs" text-anchor="start">Fail-closed entry hooks</text><circle cx="278" cy="302" r="5.5" fill="var(--s1)"/><text x="292.0" y="306.0" class="bs" text-anchor="start">Entry-attempt tracking</text><circle cx="278" cy="328" r="5" fill="none