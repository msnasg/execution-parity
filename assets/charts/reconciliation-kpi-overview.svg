<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" height="454" role="img" aria-labelledby="t d"><title id="t">Historical Replay vs Freqtrade Dry-run: reconciliation results</title><desc id="d">Bar chart of five agreement percentages: signal agreement 100, entry recall 96.98, entry precision 96.11, entry F1 96.54, strict exit agreement 59.66.</desc><style>
svg { --surface:#ffffff; --border:#d5dbe3; --ink:#1b2430; --ink2:#465263; --ink3:#5f6b7b; --grid:#e4e8ee;
       --s1:#2B65AD; --s2:#B86E1C; --neutral:#8792A2; --panel:#f4f6f9; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#0d1117; --border:#2d3643; --ink:#e6ebf2; --ink2:#b7c1ce; --ink3:#97a3b3; --grid:#232c37;
         --s1:#4C84CE; --s2:#C4802A; --neutral:#667182; --panel:#151b23; }
}
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.title { font-size:21px; font-weight:600; }
.sub { font-size:13.5px; fill:var(--ink2); }
.h { font-size:14px; font-weight:600; }
.l { font-size:13.5px; fill:var(--ink); }
.m { font-size:12.5px; fill:var(--ink3); }
.v { font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.n { font-size:12.5px; fill:var(--ink2); }
.t { font-size:11.5px; fill:var(--ink3); font-variant-numeric:tabular-nums; }
.m, .v, .t { paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
.bx { font-size:13.5px; font-weight:600; }
.bs { font-size:12px; fill:var(--ink2); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="453" rx="12" fill="var(--surface)" stroke="var(--border)"/><text x="32.0" y="44.0" class="title" text-anchor="start">Historical Replay vs Freqtrade Dry-run: reconciliation results</text><text x="32.0" y="67.0" class="sub" text-anchor="start">Corrected same-window run · 3.8-hour window · 20 Binance USD-M symbols · synthetic stress-test harness</text><line x1="214.0" y1="94.0" x2="214.0" y2="310.0" stroke="var(--grid)" stroke-width="1"/><text x="214.0" y="326.0" class="t" text-anchor="middle">0</text><line x1="326.5" y1="94.0" x2="326.5" y2="310.0" stroke="var(--grid)" stroke-width="1"/><text x="326.5" y="326.0" class="t" text-anchor="middle">25</text><line x1="439.0" y1="94.0" x2="439.0" y2="310.0" stroke="var(--grid)" stroke-width="1"/><text x="439.0" y="326.0" class="t" text-anchor="middle">50</text><line x1="551.5" y1="94.0" x2="551.5" y2="310.0" stroke="var(--grid)" stroke-width="1"/><text x="551.5" y="326.0" class="t" text-anchor="middle">75</text><line x1="664.0" y1="94.0" x2="664.0" y2="310.0" stroke="var(--grid)" stroke-width="1"/><text x="664.0" y="326.0" class="t" text-anchor="middle">100 %</text><text x="32.0" y="118.0" class="l" text-anchor="start">Signal agreement</text><path d="M214.0 102.0 H660.0 Q664.0 102.0 664.0 106.0 V120.0 Q664.0 124.0 660.0 124.0 H214.0 Z" fill="var(--s1)"/><text x="672.0" y="118.0" class="v">100.00 %<tspan class="m" font-weight="400">  (899 / 899)</tspan></text><text x="32.0" y="162.0" class="l" text-anchor="start">Entry recall</text><path d="M214.0 146.0 H646.4 Q650.4 146.0 650.4 150.0 V164.0 Q650.4 168.0 646.4 168.0 H214.0 Z" fill="var(--s1)"/><text x="658.4" y="162.0" class="v">96.98 %<tspan class="m" font-weight="400">  (642 / 662)</tspan></text><text x="32.0" y="206.0" class="l" text-anchor="start">Entry precision</text><path d="M214.0 190.0 H642.5 Q646.5 190.0 646.5 194.0 V208.0 Q646.5 212.0 642.5 212.0 H214.0 Z" fill="var(--s1)"/><text x="654.5" y="206.0" class="v">96.11 %<tspan class="m" font-weight="400">  (642 / 668)</tspan></text><text x="32.0" y="250.0" class="l" text-anchor="start">Entry F1</text><path d="M214.0 234.0 H644.4 Q648.4 234.0 648.4 238.0 V252.0 Q648.4 256.0 644.4 256.0 H214.0 Z" fill="var(--s1)"/><text x="656.4" y="250.0" class="v">96.54 %<tspan class="m" font-weight="400"></tspan></text><text x="32.0" y="294.0" class="l" text-anchor="start">Strict exit agreement</text><path d="M214.0 278.0 H478.5 Q482.5 278.0 482.5 282.0 V296.0 Q482.5 300.0 478.5 300.0 H214.0 Z" fill="var(--s1)"/><text x="490.5" y="294.0" class="v">59.66 %<tspan class="m" font-weight="400">  (383 / 642)</tspan></text><text x="32.0" y="352.0" class="n" text-anchor="start">Signal agreement is deterministic regeneration of signals from the same seed and candles. It is not proof that every generated signal</text><text x="32.0" y="369.0" class="n" text-anchor="start">was independently observed: 674 of the 899 appeared in Dry-run evidence, and all of those matched.</text><text x="32.0" y="389.0" class="n" text-anchor="start">Strict exit agreement counts a matched entry only if it closed in both systems before the cutoff, with the same exit reason and exit</text><text x="32.0" y="406.0" class="n" text-anchor="start">fills within 10 seconds. Its denominator is all 642 matched entries.</text><text x="32.0" y="426.0" class="n" text-anchor="start">Both systems are simulations. No exchange order or exchange fill is involved.</text></svg>
