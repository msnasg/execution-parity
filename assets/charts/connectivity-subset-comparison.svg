th d="M214.0 144.0 H653.4 Q657.4 144.0 657.4 148.0 V164.0 Q657.4 168.0 653.4 168.0 H214.0 Z" fill="var(--s1)"/><text x="665.4" y="161.0" class="v">98.53 %<tspan class="m" font-weight="400">  (436 of 448 / 437)</tspan></text><text x="32.0" y="226.0" class="l" text-anchor="start">Strict exit agreement</text><text x="32.0" y="244.0" class="t" text-anchor="start">agreed / matched entries</text><path d="M214.0 204.0 H478.5 Q482.5 204.0 482.5 208.0 V224.0 Q482.5 228.0 478.5 228.0 H214.0 Z" fill="var(--neutral)"/><text x="490.5" y="221.0" class="v">59.66 %<tspan class="m" font-weight="400">  (383 / 642)</tspan></text><path d="M214.0 230.0 H490.8 Q494.8 230.0 494.8 234.0 V250.0 Q494.8 254.0 490.8 254.0 H214.0 Z" fill="var(--s1)"/><text x="502.8" y="247.0" class="v">62.39 %<tspan class="m" font-weight="400">  (272 / 436)</tspan></text><text x="32.0" y="318.0" class="n" text-anchor="start">The healthy subset excludes 239 intents whose decision window or lifetime touches an audited connectivity episode or the five minutes</text><text x="32.0" y="335.0" class="n" text-anchor="start">after it. The definitions are the same in both rows, and the subset is not a separate experiment.</text></svg>
