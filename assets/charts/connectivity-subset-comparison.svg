<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 363" width="960" height="363" role="img" aria-labelledby="t d"><title id="t">All trades vs healthy-connectivity subset</title><desc id="d">Entry F1 96.54 percent for all trades and 98.53 percent for the healthy subset; strict exit agreement 59.66 and 62.39 percent.</desc><style>
