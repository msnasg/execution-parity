offset</text><text x="32.0" y="155.0" class="t" text-anchor="start">median, signed</text><path d="M560.0 118.0 H307.6 Q303.6 118.0 303.6 122.0 V134.0 Q303.6 138.0 307.6 138.0 H560.0 Z" fill="var(--neutral)"/><text x="295.6" y="133.0" class="m" text-anchor="end">−10.68 s</text><path d="M560.0 140.0 H550.6 Q546.6 140.0 546.6 144.0 V156.0 Q546.6 160.0 550.6 160.0 H560.0 Z" fill="var(--s1)"/><text x="538.6" y="155.0" class="v" text-anchor="end">−0.56 s</text><text x="32.0" y="202.0" class="l" text-anchor="start">Entry fill-time difference</text><text x="32.0" y="219.0" class="t" text-anchor="start">median, absolute</text><path d="M560.0 182.0 H776.6 Q780.6 182.0 780.6 186.0 V198.0 Q780.6 202.0 776.6 202.0 H560.0 Z" fill="var(--neutral)"/><text x="788.6" y="197.0" class="m" text-anchor="start">9.19 s</text><path d="M560.0 204.0 H649.4 Q653.4 204.0 653.4 208.0 V220.0 Q653.4 224.0 649.4 224.0 H560.0 Z" fill="var(--s1)"/><text x="661.4" y="219.0" class="v" text-anchor="start">3.89 s</text><text x="32.0" y="266.0" class="l" text-anchor="start">Exit fill-time difference</text><text x="32.0" y="283.0" class="t" text-anchor="start">median, absolute</text><path d="M560.0 246.0 H728.5 Q732.5 246.0 732.5 250.0 V262.0 Q732.5 266.0 728.5 266.0 H560.0 Z" fill="var(--neutral)"/><text x="740.5" y="261.0" class="m" text-anchor="start">7.19 s</text><path d="M560.0 268.0 H726.6 Q730.6 268.0 730.6 272.0 V284.0 Q730.6 288.0 726.6 288.0 H560.0 Z" fill="var(--s1)"/><text x="738.6" y="283.0" class="v" text-anchor="start">7.11 s</text><text x="32.0" y="330.0" class="l" text-anchor="start">Exit fill-time difference</text><text x="32.0" y="347.0" class="t" text-anchor="start">median, signed</text><path d="M560.0 310.0 H475.8 Q471.8 310.0 471.8 314.0 V326.0 Q471.8 330.0 475.8 330.0 H560.0 Z" fill="var(--neutral)"/><text x="463.8" y="325.0" class="m" text-anchor="end">−3.67 s</text><path d="M560.0 332.0 H707.8 Q711.8 332.0 711.8 336.0 V348.0 Q711.8 352.0 707.8 352.0 H560.0 Z" fill="var(--s1)"/><text x="719.8" y="347.0" class="v" text-anchor="start">+6.32 s</text><text x="32.0" y="404.0" class="n" text-anchor="start">Signed values are replay minus Dry-run. The corrected run removed most of the entry-decision offset. Replay exits are now later than</text><text x="32.0" y="421.0" class="n" text-anchor="start">Dry-run exits, because the Aggregate Trades proxy waits for printed trades to cover an order while the Dry-run fills against its order</text><text x="32.0" y="438.0" class="n" text-anchor="start">book immediately.</text></svg>
