<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" width="960" height="466" role="img" aria-labelledby="t d"><title id="t">Execution timing: original vs corrected</title><desc id="d">Median timing differences between Historical Replay and Dry-run. Entry decision offset moved from minus 10.68 to minus 0.56 seconds; absolute entry fill difference from 9.19 to 3.89 seconds; absolute exit fill difference from 7.19 to 7.11 seconds; signed exit fill difference from minus 3.67 to plus 6.32 seconds.</desc><style>
