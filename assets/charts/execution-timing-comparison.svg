  svg { --surface:#0d1117; --border:#2d3643; --ink:#e6ebf2; --ink2:#b7c1ce; --ink3:#97a3b3; --grid:#232c37;
         --s1:#4C84CE; --s2:#C4802A; --neutral:#667182; --panel:#151b23; }
}
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.title { font-size:21px; font-weight:600; }
