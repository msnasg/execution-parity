.bs { font-size:12px; fill:var(--ink2); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="620" rx="12" fill="var(--surface)" stroke="var(--border)"/><text x="32.0" y="44.0" class="title" text-anchor="start">Original vs corrected reconciliation</text><text x="32.0" y="67.0" class="sub" text-anchor="start">Same Dry-run snapshot, data and window. The correction changed decision timing and pair-lock handling in the replay configuration only</text><rect x="214.0" y="84.0" width="12" height="12" rx="3" fill="var(--neutral)"/><text x="232.0" y="94.0" class="m" text-anchor="start">Original run</text><rect x="336.8" y="84.0" width="12" height="12" rx="3" fill="var(--s1)"/><text x="354.8" y="94.0" class="m" text-anchor="start">Corrected run</text><line x1="214.0" y1="112.0" x2="214.0" y2="410.0" stroke="var(--grid)" stroke-width="1"/><text x="214.0" y="426.0" class="t" text-anchor="middle">0</text><line x1="336.5" y1="112.0" x2="336.5" y2="410.0" stroke="var(--grid)" stroke-width="1"/><text x="336.5" y="426.0" class="t" text-anchor="middle">25</text><line x1="459.0" y1="112.0" x2="459.0" y2="410.0" stroke="var(--grid)" stroke-width="1"/><text x="459.0" y="426.0" class="t" text-anchor="middle">50</text><line x1="581.5" y1="112.0" x2="581.5" y2="410.0" stroke="var(--grid)" stroke-width="1"/><text x="581.5" y="426.0" class="t" text-anchor="middle">75</text><line x1="704.0" y1="112.0" x2="704.0" y2="410.0" stroke="var(--grid)" stroke-width="1"/><text x="704.0" y="426.0" class="t" text-anchor="middle">100 %</text><text x="32.0" y="143.0" class="l" text-anchor="start">Entry recall</text><path d="M214.0 118.0 H677.8 Q681.8 118.0 681.8 122.0 V134.0 Q681.8 138.0 677.8 138.0 H214.0 Z" fill="var(--neutral)"/><text x="689.8" y="133.0" class="m" text-anchor="start">95.47 %</text><path d="M214.0 140.0 H685.2 Q689.2 140.0 689.2 144.0 V156.0 Q689.2 160.0 685.2 160.0 H214.0 Z" fill="var(--s1)"/><text x="697.2" y="155.0" class="v" text-anchor="start">96.98 %</text><text x="32.0" y="205.0" class="l" text-anchor="start">Entry precision</text><path d="M214.0 180.0 H638.3 Q642.3 180.0 642.3 184.0 V196.0 Q642.3 200.0 638.3 200.0 H214.0 Z" fill="var(--neutral)"/><text x="650.3" y="195.0" class="m" text-anchor="start">87.41 %</text><path d="M214.0 202.0 H680.9 Q684.9 202.0 684.9 206.0 V218.0 Q684.9 222.0 680.9 222.0 H214.0 Z" fill="var(--s1)"/><text x="692.9" y="217.0" class="v" text-anchor="start">96.11 %</text><text x="32.0" y="267.0" class="l" text-anchor="start">Entry F1</text><path d="M214.0 242.0 H657.2 Q661.2 242.0 661.2 246.0 V258.0 Q661.2 262.0 657.2 262.0 H214.0 Z" fill="var(--neutral)"/><text x="669.2" y="257.0" class="m" text-anchor="start">91.26 %</text><path d="M214.0 264.0 H683.0 Q687.0 264.0 687.0 268.0 V280.0 Q687.0 284.0 683.0 284.0 H214.0 Z" fill="var(--s1)"/><text x="695.0" y="279.0" class="v" text-anchor="start">96.54 %</text><text x="32.0" y="329.0" class="l" text-anchor="start">Position-count agreement</text><path d="M214.0 304.0 H405.4 Q409.4 304.0 409.4 308.0 V320.0 Q409.4 324.0 405.4 324.0 H214.0 Z" fill="var(--neutral)"/><text x="417.4" y="319.0" class="m" text-anchor="start">39.87 %</text><path d="M214.0 326.0 H462.5 Q466.5 326.0 466.5 330.0 V342.0 Q466.5 346.0 462.5 346.0 H214.0 Z" fill="var(--s1)"/><text x="474.5" y="341.0" class="v" text-anchor="start">51.53 %</text><text x="32.0" y="391.0" class="l" text-anchor="start">Strict exit agreement</text><path d="M214.0 366.0 H538.0 Q542.0 366.0 542.0 370.0 V382.0 Q542.0 386.0 538.0 386.0 H214.0 Z" fill="var(--neutral)"/><text x="550.0" y="381.0" class="m" text-anchor="start">66.93 %</text><path d="M214.0 388.0 H502.3 Q506.3 388.0 506.3 392.0 V404.0 Q506.3 408.0 502.3 408.0 H214.0 Z" fill="var(--s1)"/><text x="514.3" y="403.0" class="v" text-anchor="start">59.66 %</text><text x="32.0" y="454.0" class="h" text-anchor="start">Median entry decision offset (seconds, replay minus Dry-run)</text><line x1="742.0" y1="468.0" x2="742.0" y2="528.0" stroke="var(--ink3)" stroke-width="1"/><line x1="238.0" y1="468.0" x2="238.0" y2="528.0" stroke="var(--grid)" stroke-width="1"/><text x="238.0" y="544.0" class="t" text-anchor="middle">−12 s</text><line x1="406.0" y1="468.0" x2="406.0" y2="528.0" stroke="var(--grid)" stroke-width="1"/><text x="406.0" y="544.0" class="t" text-anchor="middle">−8 s</text><line x1="574.0" y1="468.0" x2="574.0" y2="528.0" stroke="var(--grid)" stroke-width="1"/><text x="574.0" y="544.0" class="t" text-anchor="middle">−4 s</text><text x="742.0" y="544.0" class="t" text-anchor="middle">0</text><text x="32.0" y="485.0" class="l" text-anchor="start">Original run</text><path d="M742.0 470.0 H297.3 Q293.3 470.0 293.3 474.0 V486.0 Q293.3 490.0 297.3 490.0 H742.0 Z" fill="var(--neutral)"/><text x="285.3" y="485.0" class="m" text-anchor="end">−10.68 s</text><text x="32.0" y="515.0" class="l" text-anchor="start">Corrected run</text><path d="M742.0 500.0 H722.5 Q718.5 500.0 718.5 504.0 V516.0 Q718.5 520.0 722.5 520.0 H742.0 Z" fill="var(--s1)"/><text x="710.5" y="515.0" class="v" text-anchor="end">−0.56 s</text><text x="32.0" y="576.0" class="n" text-anchor="start">Entry-side and position agreement improved. Strict exit agreement fell: the original run decided entries about 10.7 seconds early, which</text><text x="32.0" y="593.0" class="n" text-anchor="start">partly cancelled the replay&#x27;s later fills. Removing that error exposed the fill-latency gap in the Aggregate Trades proxy.</text></svg>
