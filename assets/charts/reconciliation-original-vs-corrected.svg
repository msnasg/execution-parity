<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 621" width="960" height="621" role="img" aria-labelledby="t d"><title id="t">Original vs corrected reconciliation</title><desc id="d">Paired bars for entry recall, precision, F1, position-count agreement and strict exit agreement, plus the median entry decision offset. Strict exit agreement fell from 66.93 to 59.66 percent.</desc><style>
