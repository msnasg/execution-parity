<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="960" height="558" role="img" aria-labelledby="t d"><title id="t">Execution-price accuracy: paired-order diagnostic</title><desc id="d">AGG_TRADE_PROXY compared with Depth10 on 924 paired orders: within 1 bps 69.70 versus 96.32 percent, mean absolute error 1.02 versus 0.07 bps, mean signed bias minus 0.90 versus plus 0.01 bps.</desc><style>
svg { --surface:#ffffff; --border:#d5dbe3; --ink:#1b2430; --ink2:#465263; --ink3:#5f6b7b; --grid:#e4e8ee;
       --s1:#2B65AD; --s2:#B86E1C; --neutral:#8792A2; --panel:#f4f6f9; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#0d1117; --border:#2d3643; --ink:#e6ebf2; --ink2:#b7c1ce; --ink3:#97a3b3; --grid:#232c37;
         --s1:#4C84CE; --s2:#C4802A; --neutral:#667182; --panel:#151b23; }
}
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.title { font-size:21px; font-weight:600; }
.sub { font-size:13.5px; fill:var(--ink2); }
.h { font-size:14px; font-weight:600; }
.l { font-size:13.5px; fill:var(--ink); }
.m { font-size:12.5px; fill:var(--ink3); }
.v { font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.n { font-size:12.5px; fill:var(--ink2); }
.t { font-size:11.5px; fill:var(--ink3); font-variant-numeric:tabular-nums; }
.m, .v, .t { paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
.bx { font-size:13.5px; font-weight:600; }
.bs { font-size:12px; fill:var(--ink2); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/></marker></defs><rect x="0.5" y="0.5" width="959" height="557" rx="12" fill="var(--surface)" stroke="var(--border)"/><text x="32.0" y="44.0" class="title" text-anchor="start">Execution-price accuracy: paired-order diagnostic</text><text x="32.0" y="67.0" class="sub" text-anchor="start">924 Dry-run market orders on 14 symbols · same order, instant, side and quantity for both methods</text><rect x="214.0" y="84.0" width="12" height="12" rx="3" fill="var(--s2)"/><text x="232.0" y="94.0" class="m" text-anchor="start">AGG_TRADE_PROXY</text><rect x="357.5" y="84.0" width="12" height="12" rx="3" fill="var(--s1)"/><text x="375.5" y="94.0" class="m" text-anchor="start">Depth10</text><text x="32.0" y="143.0" class="h" text-anchor="start">Within 1 bps</text><text x="32.0" y="160.0" class="t" text-anchor="start">of the Dry-run fill</text><line x1="214.0" y1="112.0" x2="214.0" y2="166.0" stroke="var(--grid)" stroke-width="1"/><text x="214.0" y="182.0" class="t" text-anchor="middle">0</text><line x1="336.5" y1="112.0" x2="336.5" y2="166.0" stroke="var(--grid)" stroke-width="1"/><text x="336.5" y="182.0" class="t" text-anchor="middle">25</text><line x1="459.0" y1="112.0" x2="459.0" y2="166.0" stroke="var(--grid)" stroke-width="1"/><text x="459.0" y="182.0" class="t" text-anchor="middle">50</text><line x1="581.5" y1="112.0" x2="581.5" y2="166.0" stroke="var(--grid)" stroke-width="1"/><text x="581.5" y="182.0" class="t" text-anchor="middle">75</text><line x1="704.0" y1="112.0" x2="704.0" y2="166.0" stroke="var(--grid)" stroke-width="1"/><text x="704.0" y="182.0" class="t" text-anchor="middle">100 %</text><path d="M214.0 118.0 H551.5 Q555.5 118.0 555.5 122.0 V134.0 Q555.5 138.0 551.5 138.0 H214.0 Z" fill="var(--s2)"/><text x="563.5" y="133.0" class="v">69.70 %<tspan class="m" font-weight="400">  (644 / 924)</tspan></text><path d="M214.0 140.0 H682.0 Q686.0 140.0 686.0 144.0 V156.0 Q686.0 160.0 682.0 160.0 H214.0 Z" fill="var(--s1)"/><text x="694.0" y="155.0" class="v">96.32 %<tspan class="m" font-weight="400">  (890 / 924)</tspan></text><text x="32.0" y="235.0" class="h" text-anchor="start">Mean absolute error</text><text x="32.0" y="252.0" class="t" text-anchor="start">basis points</text><line x1="214.0" y1="204.0" x2="214.0" y2="258.0" stroke="var(--grid)" stroke-width="1"/><text x="214.0" y="274.0" class="t" text-anchor="middle">0</text><line x1="326.5" y1="204.0" x2="326.5" y2="258.0" stroke="var(--grid)" stroke-width="1"/><text x="326.5" y="274.0" class="t" text-anchor="middle">0.25</text><line x1="439.0" y1="204.0" x2="439.0" y2="258.0" stroke="var(--grid)" stroke-width="1"/><text x="439.0" y="274.0" class="t" text-anchor="middle">0.5</text><line x1="551.5" y1="204.0" x2="551.5" y2="258.0" stroke="var(--grid)" stroke-width="1"/><text x="551.5" y="274.0" class="t" text-anchor="middle">0.75</text><line x1="664.0" y1="204.0" x2="664.0" y2="258.0" stroke="var(--grid)" stroke-width="1"/><text x="664.0" y="274.0" class="t" text-anchor="middle">1</text><path d="M214.0 210.0 H670.1 Q674.1 210.0 674.1 214.0 V226.0 Q674.1 230.0 670.1 230.0 H214.0 Z" fill="var(--s2)"/><text x="682.1" y="225.0" class="v" text-anchor="start">1.02 bps</text><path d="M214.0 232.0 H240.0 Q244.0 232.0 244.0 236.0 V248.0 Q244.0 252.0 240.0 252.0 H214.0 Z" fill="var(--s1)"/><text x="252.0" y="247.0" class="v" text-anchor="start">0.07 bps</text><text x="32.0" y="327.0" class="h" text-anchor="start">Mean signed bias</text><text x="32.0" y="344.0" class="t" text-anchor="start">bps; negative = optimistic</text><line x1="224.0" y1="296.0" x2="224.0" y2="350.0" stroke="var(--grid)" stroke-width="1"/><text x="224.0" y="366.0" class="t" text-anchor="middle">−1</text><line x1="324.0" y1="296.0" x2="324.0" y2="350.0" stroke="var(--grid)" stroke-width="1"/><text x="324.0" y="366.0" class="t" text-anchor="middle">−0.75</text><line x1="424.0" y1="296.0" x2="424.0" y2="350.0" stroke="var(--grid)" stroke-width="1"/><text x="424.0" y="366.0" class="t" text-anchor="middle">−0.5</text><line x1="524.0" y1="296.0" x2="524.0" y2="350.0" stroke="var(--grid)" stroke-width="1"/><text x="524.0" y="366.0" class="t" text-anchor="middle">−0.25</text><line x1="724.0" y1="296.0" x2="724.0" y2="350.0" stroke="var(--grid)" stroke-width="1"/><text x="724.0" y="366.0" class="t" text-anchor="middle">+0.25</text><line x1="624.0" y1="296.0" x2="624.0" y2="350.0" stroke="var(--ink3)" stroke-width="1"/><text x="624.0" y="366.0" class="t" text-anchor="middle">0</text><path d="M624.0 302.0 H267.2 Q263.2 302.0 263.2 306.0 V318.0 Q263.2 322.0 267.2 322.0 H624.0 Z" fill="var(--s2)"/><text x="255.2" y="317.0" class="v" text-anchor="end">−0.90 bps</text><path d="M624.0 324.0 H624.6 Q628.6 324.0 628.6 328.0 V340.0 Q628.6 344.0 624.6 344.0 H624.0 Z" fill="var(--s1)"/><text x="636.6" y="339.0" class="v" text-anchor="start">+0.01 bps</text><rect x="32" y="394.0" width="896" height="142" rx="8" fill="var(--panel)" stroke="var(--border)"/><rect x="32" y="402.0" width="3" height="126" fill="var(--s2)"/><text x="48.0" y="417.0" class="h" text-anchor="start">What this measures, and what it does not</text><text x="48.0" y="437.0" class="n" text-anchor="start">Standalone diagnostic using Freqtrade&#x27;s order-book pricing routine on recorded books. It is not an integrated book-based</text><text x="48.0" y="454.0" class="n" text-anchor="start">Historical Replay run.</text><text x="48.0" y="471.0" class="n" text-anchor="start">The reference is Freqtrade&#x27;s Dry-run simulator, not exchange fills. The figures are not end-to-end trade reconciliation and not</text><text x="48.0" y="488.0" class="n" text-anchor="start">real-fill accuracy.</text><text x="48.0" y="505.0" class="n" text-anchor="start">All figures rely on a 0.885-second clock-offset correction measured at start-up. Drift over the session was not independently</text><text x="48.0" y="522.0" class="n" text-anchor="start">verified. Without the correction, Depth10 falls to about 79–81 % within 1 bps and the proxy to about 58–61 %.</text></svg>
